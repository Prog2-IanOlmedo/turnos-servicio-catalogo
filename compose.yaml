services:
  postgres:
    image: postgres:17
    container_name: catalogo-postgres
    environment:
      POSTGRES_DB: ${CATALOGO_DB_NAME}
      POSTGRES_USER: ${CATALOGO_DB_USER}
      POSTGRES_PASSWORD: ${CATALOGO_DB_PASSWORD}
    ports:
      - "127.0.0.1:${CATALOGO_DB_PORT}:5432"
    volumes:
      - catalogo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalogo:
    build: .
    container_name: catalogo-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dentro de la red de compose la base se llama postgres y escucha en 5432
      CATALOGO_DB_HOST: postgres
      CATALOGO_DB_PORT: 5432
      CATALOGO_DB_NAME: ${CATALOGO_DB_NAME}
      CATALOGO_DB_USER: ${CATALOGO_DB_USER}
      CATALOGO_DB_PASSWORD: ${CATALOGO_DB_PASSWORD}
      CATEDRA_API_URL: ${CATEDRA_API_URL:-}
      CATEDRA_JWT: ${CATEDRA_JWT:-}
      JWT_SECRET: ${JWT_SECRET:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-}
      KAFKA_CATALOG_TOPIC: ${KAFKA_CATALOG_TOPIC:-}
    ports:
      - "${CATALOGO_APP_PORT:-8081}:8080"

volumes:
  catalogo-pgdata:
