spring.application.name=catalogo

# Lee las variables desde .env en desarrollo local (si existe)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${CATALOGO_DB_HOST:localhost}:${CATALOGO_DB_PORT:5433}/${CATALOGO_DB_NAME:catalogo}
spring.datasource.username=${CATALOGO_DB_USER:catalogo}
spring.datasource.password=${CATALOGO_DB_PASSWORD}

# El esquema lo manejan las migraciones; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Servicio de la cátedra (contrato, sección 7). URL y JWT salen del entorno o del .env,
# nunca del repo. Quedan vacíos por defecto para que los tests y el CI levanten sin ellos.
catedra.api.url=${CATEDRA_API_URL:}
catedra.api.jwt=${CATEDRA_JWT:}
catedra.api.connect-timeout=${CATEDRA_CONNECT_TIMEOUT:5s}
catedra.api.read-timeout=${CATEDRA_READ_TIMEOUT:30s}
# Al arrancar pide el snapshot a la cátedra. En los tests queda en false (ver surefire en el pom).
catedra.sync.on-startup=${CATEDRA_SYNC_ON_STARTUP:true}

# Redis de la cátedra (contrato, sección 14). La clave va en el .env, nunca en el repo.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5s

# Kafka de la cátedra (sección 15.3). CatalogUpdated solo avisa que hay una versión nueva.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:catalogo-local}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_ENABLED:true}
catedra.kafka.catalog-topic=${KAFKA_CATALOG_TOPIC:catedra.catalog.sin-configurar}

# Chequeo periódico por si se pierde un aviso de Kafka (sección 16). En los tests va apagado.
catedra.sync.periodic.enabled=${CATEDRA_SYNC_PERIODIC:true}
catedra.sync.periodic.interval-ms=${CATEDRA_SYNC_INTERVAL_MS:300000}
# El health de Redis usa INFO, que la ACL de la cátedra no permite. Redis es externo:
# su estado lo informa la sincronización, no la salud de esta app.
management.health.redis.enabled=false
